spring.application.name=phrasalgame
#aqui los puertos de docker son5432:5433 donde es externo:interno si sping esta fuera de docker llarama al externo sino al interno para saber que poner en localhost
spring.datasource.url=${DB_URL}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.username=${DB_USER}
#Intenta añadir lo que falte, pero nunca borra
spring.jpa.hibernate.ddl-auto=update
#hace que el SQL salga indentado y legible las dos de abajo
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
phrasalgame.cors.allowed-origin=${CORS_ORIGIN:http://localhost:3000}
